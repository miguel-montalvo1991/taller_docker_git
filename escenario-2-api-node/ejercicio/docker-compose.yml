services:
  db:
    image: postgres:15-alpine
    container_name: ejercicio_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      
      - pg_data_ejercicio:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d

    ports:
      - "5432:5432"
    networks:
      - ejercicio_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ejercicio_pgadmin
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ejercicio_network

  api:
    build: .
    container_name: ejercicio_api
    restart: always
    ports:
      - "3001:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ejercicio_network

volumes:
  pg_data_ejercicio:

networks:
  ejercicio_network:
    driver: bridge